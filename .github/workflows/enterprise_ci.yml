name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-security-and-lint:
    name: Backend Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit safety

      - name: Run Bandit Security Scanner
        run: |
          bandit -r backend/app -ll -ii --skip B101,B104 || true

      - name: Run Flake8 Code Quality
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

  backend-tests:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    needs: backend-security-and-lint
    env:
      DATABASE_URL: "sqlite:///./test_waste.db"
      JWT_SECRET: "ci-test-secret-key-for-enterprise-pipeline-32-chars"
      GROQ_API_KEY: "mock-key-for-ci"
      ENVIRONMENT: "test"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Database Migrations
        run: |
          python -c "import sys; sys.path.append('backend'); from app.core.database import engine; from app.db.migrate import sync_database_schema; sync_database_schema(engine)"

      - name: Execute Tests with Coverage
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_MAPBOX_TOKEN: "mock-mapbox-token"
        run: npm run build

  container-verification:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        run: |
          docker build -t smart-waste-backend:ci -f backend/Dockerfile backend || true

      - name: Build Frontend Container
        run: |
          docker build -t smart-waste-frontend:ci -f frontend/Dockerfile frontend || true
