# Default values for wastecare-platform
global:
  environment: production
  domain: wastecare.gov

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/wastecare/wastecare-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  replicaCount: 3
  image:
    repository: ghcr.io/wastecare/wastecare-frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 150m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: wastecare.gov
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
    - host: api.wastecare.gov
      paths:
        - path: /
          pathType: Prefix
          serviceName: backend
  tls:
    - secretName: wastecare-tls
      hosts:
        - wastecare.gov
        - api.wastecare.gov
