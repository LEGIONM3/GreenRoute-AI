version: "3.8"

services:
  # 1. PostgreSQL 16 with pgvector Extension
  db:
    image: pgvector/pgvector:pg16
    container_name: wastecare_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wasteadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-WasteCareSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-wastecare_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=16MB
               -c maintenance_work_mem=128MB
               -c wal_buffers=16MB
               -c checkpoint_completion_target=0.9
               -c random_page_cost=1.1
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./db/backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wasteadmin} -d ${POSTGRES_DB:-wastecare_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wastecare_internal

  # 2. Redis 7 High-Throughput In-Memory Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: wastecare_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-RedisSecure2026!}
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecure2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wastecare_internal

  # 3. MinIO S3-Compatible Object Store (Knowledge Docs & Evidence Uploads)
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: wastecare_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioSecurePassword2026!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_prod_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - wastecare_internal

  # 4. FastAPI Production Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: wastecare_prod_backend
    restart: always
    environment:
      - PROJECT_NAME=WasteCare Municipal Enterprise SaaS
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wasteadmin}:${POSTGRES_PASSWORD:-WasteCareSecure2026!}@db:5432/${POSTGRES_DB:-wastecare_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecure2026!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod_super_secure_key_1M1B_2026_Enterprise_Platform!}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","https://wastecare.gov","https://api.wastecare.gov"]
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-MinioSecurePassword2026!}
      - DB_POOL_SIZE=30
      - DB_MAX_OVERFLOW=40
    ports:
      - "8000:8000"
    volumes:
      - backend_prod_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - wastecare_internal
      - wastecare_public

  # 5. Celery Background Worker (Asynchronous Report Ingestion & GIS Alerts)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: wastecare_prod_celery
    restart: always
    command: python -m app.core.task_queue
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wasteadmin}:${POSTGRES_PASSWORD:-WasteCareSecure2026!}@db:5432/${POSTGRES_DB:-wastecare_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecure2026!}@redis:6379/0
    depends_on:
      - backend
      - redis
    networks:
      - wastecare_internal

  # 6. Next.js 15 Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: wastecare_prod_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wastecare_public

  # 7. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: wastecare_prod_prometheus
    restart: always
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wastecare_internal

  # 8. Grafana Enterprise Observability Dashboard
  grafana:
    image: grafana/grafana:11.0.0
    container_name: wastecare_prod_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-GrafanaSecure2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_prod_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - wastecare_internal
      - wastecare_public

networks:
  wastecare_internal:
    driver: bridge
    internal: false
  wastecare_public:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  backend_prod_uploads:
  prometheus_prod_data:
  grafana_prod_data:
