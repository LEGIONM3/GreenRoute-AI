apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wastecare-ingress
  namespace: wastecare-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  tls:
    - hosts:
        - wastecare.gov
        - api.wastecare.gov
      secretName: wastecare-tls-certificates
  rules:
    # Public & Civic Web UI
    - host: wastecare.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wastecare-frontend-service
                port:
                  number: 3000

    # High-Throughput REST API & Observability
    - host: api.wastecare.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wastecare-backend-service
                port:
                  number: 8000
